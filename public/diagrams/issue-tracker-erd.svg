<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title description">
<title id="title">Issue tracker entity relationship diagram</title>
<desc id="description">Eleven entities. UserIdentity links User and Provider with composite primary key user_id and provider_id. Each Role belongs to one Workspace. Each UserRole connects one User and one Role, with at most one role per user per workspace. Each issue has one workspace, status and reporter, and optionally one interval and assignee. Each interval has one workspace. Comments and attachments each have one issue and one user. All relationships allow zero or more records on the child side.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#172b4d} .edge{fill:none;stroke:#526581;stroke-width:2} .label{font-size:16px;paint-order:stroke;stroke:#f8fafc;stroke-width:8;stroke-linejoin:round} .count{font-size:14px;font-weight:700;paint-order:stroke;stroke:#f8fafc;stroke-width:6} .entity{fill:#fff;stroke:#64748b;stroke-width:2} .name{font-size:22px;font-weight:650;text-anchor:middle}</style>
<rect width="1200" height="1500" fill="#f8fafc"/>
<text x="48" y="46" font-size="26" font-weight="700">Issue tracker · Entity relationships</text>

<path class="edge" d="M 300 140 H 500"/>
<text x="400" y="123" class="label" text-anchor="middle">defines</text>
<text x="325" y="161" class="count" text-anchor="middle">1</text>
<text x="475" y="161" class="count" text-anchor="middle">0..*</text>
<path class="edge" d="M 200 180 V 380 H 500"/>
<text x="320" y="367" class="label" text-anchor="middle">contains</text>
<text x="220" y="205" class="count" text-anchor="middle">1</text>
<text x="473" y="405" class="count" text-anchor="middle">0..*</text>
<path class="edge" d="M 600 180 V 350"/>
<text x="641" y="270" class="label" text-anchor="middle">groups</text>
<text x="626" y="207" class="count" text-anchor="middle">0..1</text>
<text x="625" y="333" class="count" text-anchor="middle">0..*</text>
<path class="edge" d="M 1000 180 V 270 H 670 V 350"/>
<text x="835" y="257" class="label" text-anchor="middle">classifies</text>
<text x="1020" y="206" class="count" text-anchor="middle">1</text>
<text x="697" y="333" class="count" text-anchor="middle">0..*</text>
<path class="edge" d="M 500 430 H 200 V 550"/>
<text x="337" y="452" class="label" text-anchor="middle">contains</text>
<text x="477" y="422" class="count" text-anchor="middle">1</text>
<text x="226" y="533" class="count" text-anchor="middle">0..*</text>
<path class="edge" d="M 700 430 H 1000 V 550"/>
<text x="849" y="452" class="label" text-anchor="middle">contains</text>
<text x="727" y="422" class="count" text-anchor="middle">1</text>
<text x="1028" y="533" class="count" text-anchor="middle">0..*</text>
<path class="edge" d="M 550 750 V 450"/>
<text x="512" y="611" class="label" text-anchor="middle">reports</text>
<text x="529" y="733" class="count" text-anchor="middle">1</text>
<text x="527" y="477" class="count" text-anchor="middle">0..*</text>
<path class="edge" d="M 650 750 V 450"/>
<text x="698" y="611" class="label" text-anchor="middle">handles</text>
<text x="680" y="733" class="count" text-anchor="middle">0..1</text>
<text x="677" y="477" class="count" text-anchor="middle">0..*</text>
<path class="edge" d="M 500 790 H 200 V 630"/>
<text x="337" y="777" class="label" text-anchor="middle">uploads</text>
<text x="474" y="813" class="count" text-anchor="middle">1</text>
<text x="229" y="654" class="count" text-anchor="middle">0..*</text>
<path class="edge" d="M 700 790 H 1000 V 630"/>
<text x="849" y="777" class="label" text-anchor="middle">writes</text>
<text x="726" y="813" class="count" text-anchor="middle">1</text>
<text x="1030" y="654" class="count" text-anchor="middle">0..*</text>
<rect class="entity" x="100" y="100" width="200" height="80" rx="10"/>
<text x="200" y="148.0" class="name" text-anchor="middle">Workspace</text>
<rect class="entity" x="500" y="100" width="200" height="80" rx="10"/>
<text x="600" y="148.0" class="name" text-anchor="middle">Interval</text>
<rect class="entity" x="900" y="100" width="200" height="80" rx="10"/>
<text x="1000" y="148.0" class="name" text-anchor="middle">Status</text>
<rect class="entity" x="500" y="350" width="200" height="100" rx="10"/>
<text x="600" y="408.0" class="name" text-anchor="middle">Issue</text>
<rect class="entity" x="100" y="550" width="200" height="80" rx="10"/>
<text x="200" y="598.0" class="name" text-anchor="middle">Attachment</text>
<rect class="entity" x="900" y="550" width="200" height="80" rx="10"/>
<text x="1000" y="598.0" class="name" text-anchor="middle">Comment</text>
<rect class="entity" x="500" y="750" width="200" height="80" rx="10"/>
<text x="600" y="798.0" class="name" text-anchor="middle">User</text>
<text x="600" y="1472" class="label" text-anchor="middle">1 = exactly one     ·     0..1 = optional, at most one     ·     0..* = zero or more</text>

<path class="edge" d="M 100 140 H 55 V 1050 H 100"/>
<text x="79" y="130" class="count">1</text>
<text x="70" y="950" class="label">defines</text>
<text x="76" y="1074" class="count">0..*</text>
<path class="edge" d="M 600 830 V 1010"/>
<text x="624" y="856" class="count">1</text>
<text x="622" y="991" class="count">0..*</text>
<text x="619" y="929" class="label">participates</text>
<path class="edge" d="M 300 1050 H 470"/>
<text x="327" y="1075" class="count">1</text>
<text x="446" y="1075" class="count">0..*</text>
<text x="385" y="1036" class="label" text-anchor="middle">assigns</text>
<rect class="entity" x="470" y="1010" width="260" height="80" rx="10"/>
<text x="600" y="1058" class="name">UserRole</text>
<rect class="entity" x="100" y="1010" width="200" height="80" rx="10"/>
<text x="200" y="1058" class="name">Role</text>
<text x="600" y="1128" class="label" text-anchor="middle">One assignment per user–workspace pair</text>
<path class="edge" d="M 680 830 V 870 H 1150 V 1290 H 1100"/>
<text x="702" y="858" class="count">1</text>
<text x="1162" y="1170" class="label">has</text>
<text x="1113" y="1315" class="count">0..*</text>
<path class="edge" d="M 700 1290 H 860"/>
<text x="715" y="1315" class="count">1</text>
<text x="828" y="1315" class="count">0..*</text>
<text x="780" y="1272" class="label" text-anchor="middle">authenticates</text>
<rect class="entity" x="500" y="1250" width="200" height="80" rx="10"/>
<text x="600" y="1298" class="name">Provider</text>
<rect class="entity" x="860" y="1250" width="240" height="80" rx="10"/>
<text x="980" y="1298" class="name">UserIdentity</text>
<text x="800" y="1380" class="label" text-anchor="middle">UserIdentity primary key: (user_id, provider_id)</text>
<text x="800" y="1412" class="label" text-anchor="middle">Unique external account: (provider_id, provider_subject)</text>
</svg>
