<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1345" viewBox="0 0 1200 1345" role="img" aria-labelledby="title description">
<title id="title">Incident Report role-specific status transitions</title>
<desc id="description">Each row shows the role, source statuses and permitted destinations. Multiple source and destination values allow each combination, except changing a status to itself. Every closed destination requires a nonblank Resolution. Reporter can reopen only their own issues to Reported. Admin override applies within the workspace only.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#526581"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#172b4d}.value{font-size:19px}.role{font-size:17px;font-weight:650}.box{fill:#fff;stroke:#64748b;stroke-width:1.5}.arrow{stroke:#526581;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="1345" fill="#f8fafc"/>
<text x="40" y="48" font-size="28" font-weight="700">Incident Report</text>
<text x="40" y="86" font-size="18">Allowed transitions by role · each destination requires the role shown</text>
<text x="40" y="124" font-size="17">Unfinished (incident): Reported, Investigating, Processing, Stalled.</text>
<text x="55" y="169" font-size="17">FROM</text><text x="500" y="169" font-size="17">TO</text>
<text class="role" x="45" y="195">Any role</text><rect class="box" x="40" y="207" width="370" height="83" rx="8"/><path class="arrow" d="M425 248 H475"/><rect class="box" x="490" y="207" width="670" height="83" rx="8"/>
<text class="value" x="55" y="234">New issue</text>
<text class="value" x="505" y="234">Reported only</text>
<text class="role" x="45" y="320">Reporter</text><rect class="box" x="40" y="332" width="370" height="83" rx="8"/><path class="arrow" d="M425 373 H475"/><rect class="box" x="490" y="332" width="670" height="83" rx="8"/>
<text class="value" x="55" y="359">Completed, Not Applicable</text>
<text class="value" x="505" y="359">Reported (own issues only)</text>
<text class="role" x="45" y="445">Agent, Support, Supervisor</text><rect class="box" x="40" y="457" width="370" height="83" rx="8"/><path class="arrow" d="M425 498 H475"/><rect class="box" x="490" y="457" width="670" height="83" rx="8"/>
<text class="value" x="55" y="484">Any unfinished status</text>
<text class="value" x="505" y="484">Any other unfinished status</text>
<text class="role" x="45" y="570">Agent, Supervisor</text><rect class="box" x="40" y="582" width="370" height="83" rx="8"/><path class="arrow" d="M425 623 H475"/><rect class="box" x="490" y="582" width="670" height="83" rx="8"/>
<text class="value" x="55" y="609">Any unfinished status</text>
<text class="value" x="505" y="609">Completed</text>
<text class="role" x="45" y="695">Supervisor</text><rect class="box" x="40" y="707" width="370" height="83" rx="8"/><path class="arrow" d="M425 748 H475"/><rect class="box" x="490" y="707" width="670" height="83" rx="8"/>
<text class="value" x="55" y="734">Any unfinished status</text>
<text class="value" x="505" y="734">Not Applicable</text>
<text class="role" x="45" y="820">Agent, Supervisor</text><rect class="box" x="40" y="832" width="370" height="83" rx="8"/><path class="arrow" d="M425 873 H475"/><rect class="box" x="490" y="832" width="670" height="83" rx="8"/>
<text class="value" x="55" y="859">Completed</text>
<text class="value" x="505" y="859">Any unfinished status</text>
<text class="role" x="45" y="945">Supervisor</text><rect class="box" x="40" y="957" width="370" height="83" rx="8"/><path class="arrow" d="M425 998 H475"/><rect class="box" x="490" y="957" width="670" height="83" rx="8"/>
<text class="value" x="55" y="984">Not Applicable</text>
<text class="value" x="505" y="984">Any unfinished status</text>
<text class="role" x="45" y="1070">Admin</text><rect class="box" x="40" y="1082" width="370" height="83" rx="8"/><path class="arrow" d="M425 1123 H475"/><rect class="box" x="490" y="1082" width="670" height="83" rx="8"/>
<text class="value" x="55" y="1109">Any existing status</text>
<text class="value" x="505" y="1109">Any status in this workspace</text>
<text x="40" y="1251" font-size="18">Every closed destination requires nonblank Resolution, including Admin override.</text><text x="40" y="1284" font-size="18">Reopening retains Resolution. Reporter ownership is checked against the issue’s reporter.</text><text x="40" y="1317" font-size="18">Unlisted moves are denied. Admin cannot bypass workspace or initial-status rules.</text></svg>
